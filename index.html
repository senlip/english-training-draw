<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英语培训 · 情景对话抽签</title>
<style>
  :root{
    --bg:#0B1120; --bg2:#101a30; --panel:#16213A; --panel2:#1C2A47;
    --border:#2A3A5C; --text:#F2F5FA; --muted:#93A3B8;
    --gold:#F0C75E; --gold-deep:#C9962E; --green:#4ADE80; --red:#F87171;
    --radius:20px; --shadow:0 20px 50px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(240,199,94,.10), transparent 60%),
      radial-gradient(900px 500px at 85% 110%, rgba(60,90,170,.16), transparent 60%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
    color:var(--text); min-height:100vh;
    display:flex;justify-content:center;align-items:flex-start;
    padding:22px 16px 40px; overflow-x:hidden;
  }
  .wrap{width:100%;max-width:720px}

  /* ========== 通用 ========== */
  .screen{display:none;animation:fadeUp .4s ease both}
  .screen.show{display:block}
  .back-btn{background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:8px 16px;border-radius:40px;font-size:.85rem;cursor:pointer;transition:all .15s}
  .back-btn:active{transform:scale(.94)}
  .cls-badge{display:inline-flex;align-items:center;gap:10px;background:rgba(240,199,94,.10);
    border:1px solid rgba(240,199,94,.35);color:var(--gold);padding:8px 18px;border-radius:40px;
    font-weight:700;font-size:.92rem;letter-spacing:1px}
  .d-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
  .remain{color:var(--muted);font-size:.88rem}
  .remain b{color:var(--gold);font-size:1.15rem;font-weight:800}
  .d-right{display:flex;align-items:center;gap:10px}
  .sound-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel);color:var(--muted);font-size:1rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .15s}
  .sound-btn.on{background:rgba(240,199,94,.14);border-color:rgba(240,199,94,.5);color:var(--gold)}
  .sound-btn:active{transform:scale(.9)}

  /* ========== 界面一：选班 ========== */
  .hero{margin:6vh 0 7vh;text-align:center;position:relative}
  .trophy{
    width:74px;height:74px;margin:0 auto 18px;border-radius:22px;position:relative;
    background:linear-gradient(160deg,#2a3a5c,#16213a);
    border:1px solid rgba(240,199,94,.35);
    box-shadow:0 12px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;animation:float 3.2s ease-in-out infinite;
  }
  .trophy .gear{
    position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;cursor:pointer;
    opacity:.55;transition:opacity .2s, transform .3s;background:none;border:none;padding:0;
    display:flex;align-items:center;justify-content:center;color:var(--gold);
    animation:none;
  }
  .trophy .gear:hover{opacity:1;transform:rotate(60deg)}
  .trophy .gear svg{width:12px;height:12px;display:block}
  .hero h1{font-size:clamp(1.9rem,7vw,2.7rem);font-weight:800;letter-spacing:2px;
    background:linear-gradient(180deg,#fff,#d8c07a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);margin-top:10px;font-size:.95rem;letter-spacing:3px}
  .hero .gold-line{width:64px;height:3px;border-radius:2px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .class-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .class-card{
    position:relative;overflow:hidden;
    background:linear-gradient(170deg,var(--panel2),var(--panel));
    border:1px solid var(--border);border-radius:var(--radius);
    padding:24px 14px 20px;text-align:center;cursor:pointer;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .class-card::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.85}
  .class-card:active{transform:scale(.97)}
  .class-card:hover{border-color:rgba(240,199,94,.55);transform:translateY(-3px);box-shadow:var(--shadow)}
  .class-card .num{font-size:2.1rem;font-weight:800;color:#fff;letter-spacing:1px}
  .class-card .num small{font-size:.95rem;color:var(--gold);font-weight:600}
  .class-card .cnt{margin-top:8px;color:var(--muted);font-size:.84rem}
  .class-card .cnt b{color:var(--text);font-weight:700}
  .class-card .go{margin-top:14px;display:inline-block;padding:8px 22px;border-radius:40px;
    background:rgba(240,199,94,.12);border:1px solid rgba(240,199,94,.4);
    color:var(--gold);font-size:.82rem;font-weight:600;letter-spacing:1px}
  .tip{text-align:center;color:var(--muted);font-size:.82rem;margin-top:30px;letter-spacing:1px}

  /* ========== 界面二：板块选择 ========== */
  #screenBoard .board-title{text-align:center;margin:4vh 0 6vh}
  #screenBoard .board-title .cls-tag{display:inline-flex;align-items:center;gap:8px;background:rgba(240,199,94,.10);
    border:1px solid rgba(240,199,94,.35);color:var(--gold);padding:8px 24px;border-radius:40px;font-weight:700;font-size:1.1rem;letter-spacing:2px}
  #screenBoard .board-title p{color:var(--muted);margin-top:12px;font-size:.88rem;letter-spacing:2px}
  .board-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .board-card{
    background:linear-gradient(170deg,var(--panel2),var(--panel));
    border:1px solid var(--border);border-radius:26px;padding:34px 20px;text-align:center;cursor:pointer;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .board-card:active{transform:scale(.97)}
  .board-card:hover{border-color:rgba(240,199,94,.55);transform:translateY(-3px);box-shadow:var(--shadow)}
  .board-card .ico{font-size:2.6rem;margin-bottom:14px}
  .board-card h2{font-size:1.35rem;font-weight:800;letter-spacing:2px}
  .board-card p{color:var(--muted);font-size:.84rem;margin-top:10px;line-height:1.6}
  .board-card.practice h2{color:var(--gold)}
  .board-card.exam h2{color:#A8C8FF}

  /* ========== 界面三/四：练习与考试 ========== */
  .ctrl-panel{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:18px;padding:14px 16px;margin-bottom:16px}
  .ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .ctrl-label{color:var(--muted);font-size:.82rem;letter-spacing:1px}
  .ctrl-label b{color:var(--text)}
  .range-row{display:flex;align-items:center;gap:12px;margin-top:8px}
  .range-slider{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;
    background:linear-gradient(90deg,var(--gold),var(--gold-deep));outline:none;cursor:pointer}
  .range-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:#fff;border:4px solid var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .range-num{color:var(--gold);font-weight:800;font-size:1rem;min-width:44px;text-align:center}
  .seg{display:inline-flex;background:#1a2745;border:1px solid var(--border);border-radius:40px;padding:3px}
  .seg button{border:none;background:transparent;padding:6px 18px;border-radius:30px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
  .seg button.on{background:var(--gold);color:#0B1120;box-shadow:0 2px 8px rgba(240,199,94,.35)}

  .stage{
    position:relative;border-radius:26px;overflow:hidden;
    background:radial-gradient(560px 300px at 50% 0%, rgba(240,199,94,.13), transparent 65%),
      linear-gradient(180deg,#182442,#111a30);
    border:1px solid var(--border);box-shadow:var(--shadow);
    min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:26px 16px 22px;margin-bottom:16px;
  }
  .stage::before{content:"";position:absolute;top:0;left:-30%;width:30%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(240,199,94,.16),transparent);
    transform:skewX(-18deg);pointer-events:none}
  .stage.sweep::before{animation:sweep 1.1s ease both}
  .stage-label{color:var(--muted);font-size:.78rem;letter-spacing:5px;margin-bottom:6px}
  .name-display{min-height:1.2em;font-size:clamp(2.8rem,13vw,5rem);font-weight:900;color:#fff;
    letter-spacing:3px;text-align:center;line-height:1.15;word-break:break-all;
    text-shadow:0 0 30px rgba(240,199,94,.35), 0 4px 12px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center}
  .name-display.winner{animation:bounceIn .9s cubic-bezier(.2,1.4,.4,1) both}
  .scene-assign{margin-top:8px;font-size:1.15rem;color:#A8C8FF;font-weight:700;letter-spacing:1px;min-height:1.5em}
  .scene-assign b{color:var(--gold)}
  .result-line{height:1.5em;margin-top:4px;font-size:1rem;color:var(--gold);font-weight:700;letter-spacing:2px}
  .sub-hint{position:absolute;bottom:12px;color:var(--muted);font-size:.76rem;letter-spacing:1px;opacity:.7}
  .particle{position:absolute;width:8px;height:8px;border-radius:2px;background:var(--gold);
    box-shadow:0 0 8px rgba(240,199,94,.9);pointer-events:none;animation:fly .9s ease-out both;z-index:5}

  .big-btn{width:100%;padding:18px;border:none;border-radius:60px;cursor:pointer;
    font-size:1.25rem;font-weight:800;letter-spacing:4px;color:#0B1120;
    background:linear-gradient(180deg,#FFE08A,#F0C75E 55%,#D9A83C);
    box-shadow:0 12px 30px rgba(240,199,94,.28), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .15s ease}
  .big-btn:active{transform:scale(.97)}
  .big-btn:disabled{opacity:.45;filter:grayscale(.4);pointer-events:none}
  .sub-actions{display:flex;justify-content:center;gap:14px;margin:14px 0 6px}
  .text-btn{background:transparent;border:none;color:var(--muted);font-size:.82rem;padding:6px 10px;cursor:pointer;letter-spacing:1px}
  .text-btn:active{color:var(--gold)}

  /* 台词区 */
  .script-wrap{border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.03);overflow:hidden;margin-top:16px}
  .script-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;
    background:rgba(240,199,94,.08);border-bottom:1px solid var(--border);
    font-size:.84rem;font-weight:700;color:var(--gold);flex-wrap:wrap;gap:6px}
  .script-body{max-height:420px;overflow-y:auto;padding:8px 12px}
  .line{display:flex;gap:10px;padding:7px 6px;border-radius:12px}
  .line .spk{flex:0 0 30px;height:24px;line-height:24px;text-align:center;border-radius:20px;
    font-size:.7rem;font-weight:700;color:#fff;margin-top:2px}
  .line.role-a .spk{background:#2a5c9a}
  .line.role-b .spk{background:#2e7d5b}
  .line .txt{flex:1;min-width:0}
  .line .en{font-size:.98rem;font-weight:500;color:var(--text)}
  .line .zh{font-size:.88rem;color:var(--muted);margin-top:2px}
  .line.role-a{border-left:3px solid #3d6cb8}
  .line.role-b{border-left:3px solid #3da06f}
  .exam .line .en{display:none}
  .empty-script{color:var(--muted);font-style:italic;padding:18px;text-align:center;font-size:.9rem}

  .history{margin-top:16px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:18px;padding:14px 14px 10px}
  .history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .history-head h3{font-size:.9rem;color:var(--muted);letter-spacing:1px;font-weight:600}
  .history-head h3 b{color:var(--gold)}
  .history-list{display:flex;flex-wrap:wrap;gap:8px;min-height:36px}
  .h-chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);
    border:1px solid var(--border);border-radius:40px;padding:5px 13px 5px 9px;font-size:.86rem;color:var(--text);cursor:pointer;transition:all .12s}
  .h-chip:hover{border-color:rgba(240,199,94,.5)}
  .h-chip .idx{background:rgba(240,199,94,.18);color:var(--gold);border-radius:30px;font-size:.66rem;font-weight:700;padding:1px 7px}
  .h-chip .sc{background:rgba(168,200,255,.15);color:#A8C8FF;border-radius:30px;font-size:.66rem;font-weight:700;padding:1px 7px}
  .history-empty{color:var(--muted);font-size:.82rem;opacity:.7}

  /* ========== 后台终端 ========== */
  .term-mask{position:fixed;inset:0;background:rgba(4,8,16,.72);backdrop-filter:blur(4px);
    z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
  .term-mask.show{display:flex;animation:fadeIn .25s ease}
  .term{
    width:100%;max-width:620px;max-height:78vh;display:flex;flex-direction:column;
    background:#0A0F16;border:1px solid #2A3A4C;border-radius:14px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    font-family:"Cascadia Code",Consolas,"Courier New",monospace;
  }
  .term-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#131A24;border-bottom:1px solid #22303f}
  .term-dot{width:11px;height:11px;border-radius:50%}
  .term-dot.r{background:#ff5f57}.term-dot.y{background:#febc2e}.term-dot.g{background:#28c840}
  .term-title{color:#5c7184;font-size:.78rem;margin-left:8px;letter-spacing:1px}
  .term-body{flex:1;overflow-y:auto;padding:14px 16px;font-size:.82rem;line-height:1.7;color:#9FE8C8;min-height:240px}
  .term-body .t-dim{color:#5c7184}
  .term-body .t-ok{color:#4ADE80}
  .term-body .t-warn{color:#F0C75E}
  .term-body .t-err{color:#F87171}
  .term-body pre{margin:0;white-space:pre-wrap;word-break:break-all}
  .term-input-row{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#0A0F16;border-top:1px solid #22303f}
  .term-prompt{color:#4ADE80;font-size:.85rem;white-space:nowrap}
  .term-input{flex:1;background:transparent;border:none;outline:none;color:#E8EEF4;
    font-family:inherit;font-size:.85rem}
  .term-close{position:absolute;top:0;right:0}

  /* ========== 动画 ========== */
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes sweep{from{left:-30%}to{left:110%}}
  @keyframes bounceIn{0%{transform:scale(.2);opacity:0}40%{transform:scale(1.3);opacity:1}
    60%{transform:scale(.9)}75%{transform:scale(1.12)}90%{transform:scale(.98)}100%{transform:scale(1)}}
  @keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}
  @media (max-width:520px){
    .class-grid{grid-template-columns:1fr;gap:12px}
    .class-card{padding:18px 14px 16px}
    .board-grid{grid-template-columns:1fr}
    .stage{min-height:210px}
    .name-display{font-size:clamp(2.4rem,12vw,3.6rem)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 界面一：选班级 ===== -->
  <div id="screenChoose" class="screen show">
    <div class="hero">
      <div class="trophy">
        🏆
        <button class="gear" id="gearBtn" onclick="openTerm()" title="后台">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.61 3.61 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
      <h1>英语培训 · 情景对话</h1>
      <p>中 铝 · 练 习 与 考 试 抽 签</p>
      <div class="gold-line"></div>
    </div>
    <div class="class-grid" id="classGrid"></div>
    <div class="tip">选择班级进入 · 平时练习 / 考试 两种模式</div>
  </div>

  <!-- ===== 界面二：板块选择 ===== -->
  <div id="screenBoard" class="screen">
    <div class="d-header">
      <button class="back-btn" onclick="goChoose()">‹ 返回</button>
      <div class="cls-badge" id="boardClsBadge"></div>
      <div></div>
    </div>
    <div class="board-title">
      <div class="cls-tag" id="boardClsTag"></div>
      <p>选择本次使用方式</p>
    </div>
    <div class="board-grid">
      <div class="board-card practice" onclick="enterMode('practice')">
        <div class="ico">📖</div>
        <h2>平时练习</h2>
        <p>情景范围可控 · 顺序/随机抽签<br>显示完整中英对照台词</p>
      </div>
      <div class="board-card exam" onclick="enterMode('exam')">
        <div class="ico">📝</div>
        <h2>考试</h2>
        <p>全情景随机抽签<br>仅显示中文台词</p>
      </div>
    </div>
  </div>

  <!-- ===== 界面三/四：练习 / 考试 ===== -->
  <div id="screenWork" class="screen">
    <div class="d-header">
      <button class="back-btn" onclick="goBoard()">‹ 返回</button>
      <div class="cls-badge" id="workClsBadge"></div>
      <div class="d-right">
        <div class="remain">剩余 <b id="remainNum">0</b> 人</div>
        <button class="sound-btn" id="soundBtn" onclick="toggleSound()" title="音效开关">🔇</button>
      </div>
    </div>

    <!-- 平时练习：控制区 -->
    <div class="ctrl-panel" id="ctrlPractice" style="display:none">
      <div class="ctrl-row">
        <span class="ctrl-label">已学情景范围 <b id="rangeDesc">场景 1 – 30</b></span>
        <span class="ctrl-label">抽签方式</span>
      </div>
      <div class="range-row">
        <span class="range-num" id="sceneCountNum">30</span>
        <input type="range" class="range-slider" id="sceneCountSlider" min="1" max="30" value="30">
        <div class="seg" id="modeSeg">
          <button id="segSeq" class="on" onclick="setMode('seq')">按顺序</button>
          <button id="segRand" onclick="setMode('rand')">随机</button>
        </div>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="stage-label" id="stageLabel">— 抽 签 台 —</div>
      <div class="name-display" id="nameDisplay">—</div>
      <div class="scene-assign" id="sceneAssign">&nbsp;</div>
      <div class="result-line" id="resultLine">&nbsp;</div>
      <div class="sub-hint" id="subHint">点击下方按钮开始抽签</div>
    </div>

    <button class="big-btn" id="drawBtn" onclick="startDraw()">🎲　开 始 抽 签</button>
    <div class="sub-actions">
      <button class="text-btn" onclick="resetMode()">↺ 重置本板块</button>
    </div>

    <!-- 台词区 -->
    <div class="script-wrap" id="scriptWrap" style="display:none">
      <div class="script-head" id="scriptTitle"></div>
      <div class="script-body" id="scriptBody"></div>
    </div>

    <div class="history">
      <div class="history-head">
        <h3>已抽记录（<b id="histCount">0</b>）· 点击可回看台词</h3>
        <button class="text-btn" onclick="resetMode()">清空</button>
      </div>
      <div class="history-list" id="historyList"><span class="history-empty">尚未开始抽签</span></div>
    </div>
  </div>

  <!-- ===== 后台终端 ===== -->

const sceneById = id => SCENES.find(s => s.id === id);
const sceneTitle = id => '场景' + id + '：' + sceneById(id).title;

/* ================= 界面一：选班 ================= */
function renderChoose(){
  const grid = $('classGrid');
  grid.innerHTML = '';
  Object.keys(CLASS_DATA).forEach(name => {
    const n = CLASS_DATA[name].length, num = name.replace(/\D/g,'');
    const card = document.createElement('div');
    card.className = 'class-card';
    card.onclick = () => enterClass(name);
    card.innerHTML = `<div class="num">${num}<small> 班</small></div>
      <div class="cnt">共 <b>${n}</b> 人</div>
      <div class="go">进入 →</div>`;
    grid.appendChild(card);
  });
}

/* ================= 界面二：板块选择 ================= */
function enterMode(mode){
  curMode = mode;

  if (saved){
    try{

      usedScenes = Array.isArray(st.u) ? st.u : [];

  } else resetState();
  remaining = CLASS_DATA[curClass].filter(p => !drawn.includes(p));

  $('stageLabel').textContent = mode === 'practice' ? '— 练 习 抽 签 台 —' : '— 考 试 抽 签 台 —';
  $('ctrlPractice').style.display = mode === 'practice' ? 'block' : 'none';
  document.getElementById('screenWork').classList.toggle('exam', mode === 'exam');
  syncSoundBtn();

function resetState(){

/* ================= 工作界面渲染 ================= */
function renderWork(){
  $('remainNum').textContent = remaining.length;
  $('histCount').textContent = drawn.length;
  const list = $('historyList');
  if (drawn.length === 0){
    list.innerHTML = '<span class="history-empty">尚未开始抽签</span>';
  } else {
    list.innerHTML = drawn.map((rec,i) => {
      const p = typeof rec === 'string' ? rec : rec.p;
      const s = typeof rec === 'string' ? null : rec.s;
      const sc = s ? `<span class="sc">场景${s}</span>` : '';
      return `<span class="h-chip" onclick="viewHistory(${i})"><span class="idx">${i+1}</span>${p}${sc}</span>`;
    }).join('');
  }
  const btn = $('drawBtn');
  const peopleDone = remaining.length === 0;
  const scenesDone = curMode === 'practice'
    ? usedScenes.length >= learnedN
    : usedScenes.length >= SCENES.length;
  if (peopleDone && scenesDone){
    btn.textContent = '🏁　人员与情景均已抽完';
    btn.disabled = true;
    $('subHint').textContent = '已全部抽完 · 可重置本板块重新开始';
  } else if (peopleDone){
    btn.textContent = '👥　人员已抽完（情景剩余）';
    btn.disabled = true;
    $('subHint').textContent = '本班人员已全部抽完 · 可重置本板块';
  } else if (scenesDone){
    btn.textContent = '🎬　情景已抽完（人员剩余）';
    btn.disabled = true;
    $('subHint').textContent = '情景已全部用完 · 可重置本板块';
  } else {
    btn.textContent = '🎲　开 始 抽 签';
    btn.disabled = false;
    $('subHint').textContent = '每次抽取 1 人 + 分配 1 个情景';
  }
}

/* ================= 权重与绑定（后台可设） ================= */
const WKEY = 'et3_weights', BKEY = 'et3_binds';
function getWeights(){
  try{ return JSON.parse(localStorage.getItem(WKEY)) || {}; }catch(e){ return {}; }
}
function saveWeights(w){ localStorage.setItem(WKEY, JSON.stringify(w)); }
function getBinds(){
  try{ return JSON.parse(localStorage.getItem(BKEY)) || {}; }catch(e){ return {}; }
}
function saveBinds(b){ localStorage.setItem(BKEY, JSON.stringify(b)); }
function personWeight(p){
  const w = getWeights()[p];
  return (typeof w === 'number' && w >= 0) ? w : 1;
}

/* 加权随机抽人：权重越大越易中，0 = 不参与 */
function pickWeightedPerson(remaining){
  const pool = remaining.filter(p => personWeight(p) > 0);
  const cand = pool.length > 0 ? pool : remaining;
  const total = cand.reduce((s,p) => s + personWeight(p), 0);
  let r = Math.random() * total;
  for (const p of cand){
    r -= personWeight(p);
    if (r <= 0) return p;
  }
  return cand[cand.length - 1];
}

/* 绑定优先：该人固定分配绑定情景（未用过时生效），否则正常分配 */
function pickSceneFor(person){
  const bind = getBinds()[person];
  if (bind && bind >= 1 && bind <= SCENES.length && !usedScenes.includes(bind)){
    return {id: bind, bound: true};
  }
  const id = pickScene();
  return id === null ? null : {id, bound: false};
}

/* ================= 抽签 ================= */
function pickScene(){
  if (curMode === 'exam'){
    // 考试：全部场景随机，不重复
    const pool = SCENES.map(s => s.id).filter(id => !usedScenes.includes(id));
    if (pool.length === 0) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }
  // 平时练习
  if (sceneMode === 'seq'){
    // 顺序：从 nextScene 开始，超出已学范围重置
    while (usedScenes.includes(nextScene) && nextScene <= learnedN) nextScene++;
    if (nextScene > learnedN){ nextScene = 1; }
    while (usedScenes.includes(nextScene)) nextScene++;
    if (nextScene > learnedN) return null;   // 范围内全用过
    return nextScene;
  }
  // 随机
  const pool = [];
  for (let i = 1; i <= learnedN; i++) if (!usedScenes.includes(i)) pool.push(i);
  if (pool.length === 0) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

function startDraw(){
  if (spinning) return;
  if (remaining.length === 0){ renderWork(); return; }
  spinning = true;
  $('drawBtn').disabled = true;
  $('resultLine').innerHTML = '&nbsp;';
  $('sceneAssign').innerHTML = '&nbsp;';
  $('scriptWrap').style.display = 'none';
  const nameEl = $('nameDisplay');
  nameEl.classList.remove('winner');
  const stage = $('stage');
  stage.classList.remove('sweep');

  const winner = pickWeightedPerson(remaining);
  const pool = remaining.slice();
  const FAST = 18, SLOW = 9;
  let step = 0, interval = 50;

  function tickOne(){
    nameEl.textContent = pool[Math.floor(Math.random() * pool.length)];
    playTick();
    step++;
    if (step < FAST) setTimeout(tickOne, 50);
    else if (step < FAST + SLOW){ interval += 45; setTimeout(tickOne, interval); }
    else settle();
  }
  setTimeout(tickOne, 50);

  function settle(){
    const scObj = pickSceneFor(winner);
    if (scObj === null){
      // 无可用情景
      nameEl.textContent = winner;
      $('resultLine').innerHTML = '⚠ 情景已全部用完，请重置本板块';
      $('subHint').textContent = '重置本板块后可继续抽签';
      spinning = false;
      return;
    }
    const sc = scObj.id;
    nameEl.textContent = winner;
    nameEl.classList.add('winner');
    stage.classList.add('sweep');
    playWinner();
    burstParticles(nameEl);
    $('sceneAssign').innerHTML = '🎬 情景：<b>' + sceneTitle(sc) + '</b>' + (scObj.bound ? '<span style="color:var(--gold);font-size:.7em;margin-left:8px">🔗 绑定</span>' : '');
    $('resultLine').innerHTML = '✨ 恭喜 ' + winner + ' 抽中！✨';
    $('subHint').textContent = '点击按钮抽取下一位';
    remaining = remaining.filter(p => p !== winner);
    usedScenes.push(sc);
    nextScene = sc + 1;
    drawn.push({p: winner, s: sc});
    localStorage.setItem(KEY(curClass, curMode), JSON.stringify({d: drawn, u: usedScenes, n: nextScene}));
    renderScript(sc, curMode === 'exam');
    renderWork();
    spinning = false;
  }
}

function viewHistory(i){

  if (!rec || !rec.s) return;

/* ================= 重置 ================= */
function resetMode(){
  if (spinning) return;
  const label = curClass + ' · ' + (curMode === 'practice' ? '平时练习' : '考试');
  if (!confirm('确认重置「' + label + '」的抽签记录？人员与情景都将恢复。')) return;
  resetState();
  localStorage.removeItem(KEY(curClass, curMode));
  $('nameDisplay').textContent = '—';
  $('sceneAssign').innerHTML = '&nbsp;';
  $('resultLine').innerHTML = '&nbsp;';
  $('scriptWrap').style.display = 'none';
  remaining = CLASS_DATA[curClass].slice();
  $('subHint').textContent = '已重置 · 点击按钮开始抽签';
  renderWork();
}

/* ================= 音效 ================= */
let audioCtx = null;
function ctx(){ if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function syncSoundBtn(){
  const b = $('soundBtn');
  b.textContent = soundOn ? '🔊' : '🔇';
  b.classList.toggle('on', soundOn);
}
function toggleSound(){
  soundOn = !soundOn;
  syncSoundBtn();
  if (soundOn){ ctx(); playTick(); }
}
function playTick(){
  if (!soundOn) return;
  try{
    const c = ctx(), t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type='square'; o.frequency.setValueAtTime(880,t);
    g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.001,t+.04);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+.05);
  }catch(e){}
}
function playWinner(){
  if (!soundOn) return;
  try{
    const c = ctx(), t = c.currentTime;
    const o1=c.createOscillator(), g1=c.createGain();
    o1.type='sine'; o1.frequency.setValueAtTime(150,t);
    o1.frequency.exponentialRampToValueAtTime(50,t+.3);
    g1.gain.setValueAtTime(.8,t); g1.gain.exponentialRampToValueAtTime(.001,t+.35);
    o1.connect(g1).connect(c.destination); o1.start(t); o1.stop(t+.38);
    const o2=c.createOscillator(), g2=c.createGain();
    o2.type='triangle'; o2.frequency.setValueAtTime(1318,t+.1); o2.frequency.setValueAtTime(1760,t+.32);
    g2.gain.setValueAtTime(.001,t+.1); g2.gain.exponentialRampToValueAtTime(.25,t+.14);
    g2.gain.exponentialRampToValueAtTime(.001,t+.9);
    o2.connect(g2).connect(c.destination); o2.start(t+.1); o2.stop(t+1);
  }catch(e){}
}

/* ================= 粒子 ================= */
function burstParticles(el){
  const rect = el.getBoundingClientRect();
  const stage = $('stage'), sRect = stage.getBoundingClientRect();
  const cx = rect.left - sRect.left + rect.width/2, cy = rect.top - sRect.top + rect.height/2;
  for (let i=0;i<42;i++){
    const p = document.createElement('span');
    p.className='particle';
    const ang = Math.random()*Math.PI*2, dist = 70+Math.random()*150;
    p.style.left = cx+'px'; p.style.top = cy+'px';
    p.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    p.style.animationDelay = (Math.random()*.12)+'s';
    p.style.width = p.style.height = (5+Math.random()*6)+'px';
    p.style.opacity = .6+Math.random()*.6;
    stage.appendChild(p);
    setTimeout(()=>p.remove(), 1200);
  }
}

/* ================= 后台终端 ================= */
const termHelp = [
  '<span class="t-ok">可用命令：</span>',
  '  people         查看全部班级人员名单',
  '  classes        查看班级统计',
  '  scenes         查看情景数据统计',
  '  status         查看当前各板块抽签进度',
  '  weight &lt;姓名&gt; &lt;N&gt;   设置某人抽中权重（默认1，0=不参与，越大越易中）',
  '  weights        查看全部权重设置',
  '  weight reset   全部权重恢复为 1',
  '  bind &lt;姓名&gt; &lt;序号&gt;  把某人固定绑定到某情景（抽中即分配该情景）',
  '  binds          查看全部绑定',
  '  bind reset     清除全部绑定',
  '  reset &lt;班&gt;   清空指定班级全部记录（1/2/3/all）',
  '  clear          清屏',
  '  exit           关闭终端'
];
function termPrint(html){
  const body = $('termBody');
  const d = document.createElement('div');
  d.innerHTML = html;
  body.appendChild(d);
  body.scrollTop = body.scrollHeight;
}
function termInit(){
  termPrint('<span class="t-dim">中铝英语培训 · 后台终端 v1.0</span>');
  termPrint('<span class="t-dim">输入 help 查看命令列表</span>');
  termPrint('');
}
function openTerm(){
  $('termMask').classList.add('show');
  const body = $('termBody');
  if (body.children.length === 0) termInit();
  setTimeout(()=>$('termInput').focus(), 50);
}
function closeTerm(){ $('termMask').classList.remove('show'); }
function termExec(){
  const input = $('termInput');
  const cmd = input.value.trim();
  input.value = '';
  termPrint('<span class="t-dim">admin@training:~$</span> ' + (cmd || ''));
  if (!cmd) return;
  const parts = cmd.split(/\s+/);
  const c = parts[0].toLowerCase();
  switch(c){
    case 'help':
      termHelp.forEach(l=>termPrint(l));
      break;
    case 'people':
      Object.keys(CLASS_DATA).forEach(k=>{
        termPrint('<span class="t-ok">'+k+'（'+CLASS_DATA[k].length+'人）</span>');
        termPrint('<span class="t-dim">' + CLASS_DATA[k].join(' / ') + '</span>');
      });
      break;
    case 'classes':
      Object.keys(CLASS_DATA).forEach(k=>{
        termPrint('<span class="t-ok">'+k+'</span>　共 <b>'+CLASS_DATA[k].length+'</b> 人');
      });
      termPrint('<span class="t-dim">总计 ' + Object.values(CLASS_DATA).reduce((a,b)=>a+b.length,0) + ' 人</span>');
      break;
    case 'scenes':
      termPrint('<span class="t-ok">情景库：共 ' + SCENES.length + ' 个</span>');
      SCENES.forEach(s=>termPrint('  <span class="t-dim">'+s.id+'. '+s.title+'（'+s.lines.length+' 句）</span>'));
      break;
    case 'status':{
      Object.keys(CLASS_DATA).forEach(k=>{
        termPrint('<span class="t-ok">'+k+'</span>');
        ['practice','exam'].forEach(m=>{
          const st = JSON.parse(localStorage.getItem(KEY(k,m)) || 'null');
          const total = CLASS_DATA[k].length;
          const got = st ? st.d.length : 0;
          const used = st ? (st.u||[]).length : 0;
          const nm = m==='practice'?'平时练习':'考试';
          termPrint('  <span class="t-dim">'+nm+': 已抽 '+got+'/'+total+' 人 · 已用情景 '+used+' 个'+(m==='practice'?'（范围 '+learnedN+'）':'（共 30）')+'</span>');
        });
      });
      break;
    }
    case 'weight':{
      const p = parts[1], v = parseFloat(parts[2]);
      if (!p){
        termPrint('<span class="t-err">用法：weight &lt;姓名&gt; &lt;N&gt;（0=不参与，越大越易中）；weight reset 恢复默认</span>');
        break;
      }
      if (p === 'reset'){
        saveWeights({});
        termPrint('<span class="t-ok">已清除全部权重设置（所有人权重=1）</span>');
        break;
      }
      // 校验姓名存在
      const found = Object.values(CLASS_DATA).flat().includes(p);
      if (!found){
        termPrint('<span class="t-err">未找到人员：' + p + '</span>');
        break;
      }
      if (isNaN(v) || v < 0){
        termPrint('<span class="t-err">权重需为 ≥0 的数字（0=不参与）</span>');
        break;
      }
      const w = getWeights();
      w[p] = v;
      saveWeights(w);
      termPrint('<span class="t-ok">已设置 ' + p + ' 权重 = ' + v + '（' + (v===0?'不参与抽签':v===1?'普通概率':'普通人的 '+v+' 倍') + '）</span>');
      break;
    }
    case 'weights':{
      const w = getWeights();
      const keys = Object.keys(w);
      if (keys.length === 0){
        termPrint('<span class="t-dim">暂无权重设置，所有人权重均为 1</span>');
        break;
      }
      keys.forEach(k=>termPrint('<span class="t-ok">'+k+'</span>　权重 <b>'+w[k]+'</b>'));
      break;
    }
    case 'bind':{
      const p = parts[1], v = parseInt(parts[2], 10);
      if (!p){
        termPrint('<span class="t-err">用法：bind &lt;姓名&gt; &lt;场景序号&gt;（1-'+SCENES.length+'）；bind reset 清除全部</span>');
        break;
      }
      if (p === 'reset'){
        saveBinds({});
        termPrint('<span class="t-ok">已清除全部绑定</span>');
        break;
      }
      const found = Object.values(CLASS_DATA).flat().includes(p);
      if (!found){
        termPrint('<span class="t-err">未找到人员：' + p + '</span>');
        break;
      }
      if (isNaN(v) || v < 1 || v > SCENES.length){
        termPrint('<span class="t-err">场景序号需为 1-'+SCENES.length+' 的整数</span>');
        break;
      }
      const b = getBinds();
      b[p] = v;
      saveBinds(b);
      termPrint('<span class="t-ok">已绑定 ' + p + ' → 场景' + v + '（' + sceneTitle(v) + '）</span>');
      break;
    }
    case 'binds':{
      const b = getBinds();
      const keys = Object.keys(b);
      if (keys.length === 0){
        termPrint('<span class="t-dim">暂无绑定设置</span>');
        break;
      }
      keys.forEach(k=>termPrint('<span class="t-ok">'+k+'</span>　→　场景'+b[k]+'（'+sceneById(b[k]).title+'）'));
      break;
    }
    case 'reset':{
      const t = (parts[1]||'').toLowerCase();
      const targets = t==='all' ? Object.keys(CLASS_DATA)
        : Object.keys(CLASS_DATA).filter(k=>k.includes(t));
      if (targets.length === 0){
        termPrint('<span class="t-err">未找到班级：' + (parts[1]||'') + '（可用 1/2/3/all）</span>');
        break;
      }
      targets.forEach(k=>{
        localStorage.removeItem(KEY(k,'practice'));
        localStorage.removeItem(KEY(k,'exam'));
      });
      termPrint('<span class="t-ok">已清空：' + targets.join('、') + ' 的全部抽签记录</span>');
      break;
    }
    case 'clear':
      $('termBody').innerHTML = '';
      break;
    case 'exit':
    case 'quit':
      closeTerm();
      break;
    default:
      termPrint('<span class="t-err">未知命令：'+c+'（输入 help 查看）</span>');
  }
}

renderChoose();

  if (e.code === 'Space' && $('screenWork').classList.contains('show') && !spinning && !$('drawBtn').disabled){
    e.preventDefault(); startDraw();
